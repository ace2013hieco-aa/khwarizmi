# verifier.yaml — runtime profile configuration (ARCHITECTURE_DELTA §2.3).
#
# The verifier may propose evidence-ladder rungs and replications; it may NOT
# propose gate overrides (declared under requires_human_for, refused as PROPOSAL),
# because a gate override is an operator verdict, not a plane's.
version: "1"
name: verifier
role: independent verification of an experiment's claimed result
agent_profile: ADVERSARY

model_policy:
  tier: adversary
  contract: runtime_proposal_v1
  kind_field: kind
  rationale_field: rationale
  structured_fields: [proposals, delegations]
  allows_tool_calls: false
  max_output_tokens: 2048

tools: [evidence_inspect, statistic_check]

authority:
  proposable_kinds:
    - EVIDENCE_TRANSITION
    - REQUEST_REPLICATION
  director_only: false
  allowed_capabilities: [evidence_inspect, statistic_check]
  requires_human_for:
    - PROPOSE_GATE_OVERRIDE
    - ABANDON

schemas:
  proposal: runtime_proposal_v1
  draft: [kind, rationale, payload]

termination:
  max_ticks: 3
  max_proposals: 4
  stop_when: proposals_raised
  max_model_calls_per_tick: 1
  max_tool_calls: 2
  deadline_seconds: 240

review:
  required: false
